:root{--cotton:#FBF8F2;--chalk:#E9E3D6;--chalk2:#F2EDE2;--kohl:#1D1B1A;--soft:#6B665D;--kohl2:#2C2926;--onk:#A9A39A;--acc:#5BB5F0;--acclt:#D3EAFB;--ok:#0F6B66;--oklt:#CFE8E3;--bad:#D4543A;--badlt:#F8D7CE;--sw1:#C94F6D;--sw2:#2E6F95;--sw3:#7A9E3B;--sw4:#E07B39;--sw5:#1F8A70;--sh:0 1px 2px rgba(29,27,26,.06),0 12px 24px -10px rgba(29,27,26,.12);--serif:"DM Serif Display",Georgia,serif;--sans:Manrope,-apple-system,"Kohinoor Devanagari","Noto Sans Devanagari",system-ui,sans-serif;color-scheme:light}
[data-theme=forest]{--cotton:#F6F3EE;--chalk:#E5DFD4;--chalk2:#EFEAE0;--kohl:#17322A;--soft:#5C7066;--kohl2:#25443A;--onk:#AEC2B7;--acc:#F08A5D;--acclt:#FBD9C7;--ok:#2E8B5E;--oklt:#D4EBDD;--bad:#C94545;--badlt:#F6D5D3}
[data-theme=rose]{--cotton:#F7F3F2;--chalk:#E8DFDD;--chalk2:#F2EBE9;--kohl:#24222A;--soft:#6E6A73;--kohl2:#332F39;--onk:#B3AEB9;--acc:#E0457B;--acclt:#FAD3E1;--ok:#1F8E83;--oklt:#CBEAE6;--bad:#D2501E;--badlt:#F7D7CB}
[data-theme=ocean]{--cotton:#F2F6F6;--chalk:#DCE5E4;--chalk2:#E9F0EF;--kohl:#0D2B33;--soft:#547077;--kohl2:#18414B;--onk:#9EBBC2;--acc:#FF7A59;--acclt:#FFD8CC;--ok:#2A9D6F;--oklt:#CFEBDD;--bad:#B3263E;--badlt:#F4D1D7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}html.big body{zoom:1.18}html.big #app{height:calc(100dvh/1.18)}
body{margin:0;background:var(--cotton);color:var(--kohl);font:500 16px/1.4 var(--sans);overscroll-behavior:none}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0}h1{font:400 34px/1.1 var(--serif)}h2{font:400 24px/1.15 var(--serif)}h3{font:800 16px var(--sans)}
small{display:block;color:var(--soft);font-size:13px;font-weight:500}b{font-weight:700}
button,input,select{font-family:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select{font:600 16px var(--sans);min-height:48px;padding:0 14px;border:1.5px solid var(--chalk);border-radius:14px;background:#fff;width:100%}
input:focus,select:focus{outline:3px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
.flex{flex:1}.ic{flex:none}
#app{display:flex;flex-direction:column;height:100dvh}
#top{flex:none;background:var(--cotton);border-bottom:1.5px solid var(--chalk);padding:0 28px}
.r1{display:flex;gap:16px;align-items:center;padding:16px 0}.r2{display:flex;gap:6px;align-items:center;padding-bottom:12px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font:400 22px var(--serif);flex:none}.logo.xl{width:72px;height:72px;font-size:34px;margin:0 auto 12px;background:var(--kohl)}
.wm{font:400 22px var(--serif)}
.sp{display:flex;align-items:center;gap:10px;width:330px;max-width:34vw;height:52px;padding:0 18px;border-radius:26px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--chalk);color:var(--soft);font:500 15px var(--sans)}
.lg{display:flex;gap:2px;padding:4px;background:var(--chalk2);border-radius:22px}.lg button{padding:8px 14px;border-radius:18px;font:800 13px var(--sans);color:var(--soft)}.lg button.on{background:#fff;color:var(--kohl)}
.tab{display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font:700 15px var(--sans);color:var(--soft)}.tab.on{background:var(--kohl);color:#fff}
.dt{font-size:13px;color:var(--soft)}
#main{flex:1;overflow-y:auto;padding:16px 28px 100px;-webkit-overflow-scrolling:touch}
.btn{min-height:52px;padding:0 22px;border-radius:16px;font:700 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--kohl);color:#fff;white-space:nowrap}
.btn.acc{background:var(--acc);color:var(--kohl)}.btn.dk{background:var(--kohl)}.btn.ghost{background:#fff;color:var(--kohl);box-shadow:inset 0 0 0 1.5px var(--chalk)}.btn.ok{background:var(--ok)}.btn.out{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px var(--onk)}.btn.red{color:var(--bad)}.btn.sm{min-height:42px;padding:0 16px;font-size:14px;border-radius:14px}.btn.big{width:100%;min-height:56px}.btn[disabled]{opacity:.4}
.btn:active,.tk:active,.chip:active,.gtile:active,.crow:active{transform:scale(.97)}
.btn,.tk,.chip,.gtile,.crow,.tab{transition:transform .12s,box-shadow .2s,background .2s}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:var(--chalk2);font:700 14px var(--sans);color:var(--kohl);font-style:normal}
.chip.dk{background:var(--kohl);color:#fff}.chip.dash{background:transparent;box-shadow:inset 0 0 0 1.5px var(--soft)}.chip.w{background:#fff;color:var(--bad)}.chip.a{background:var(--acclt)}.chip.g{background:var(--oklt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--chalk2);border-radius:16px}.seg button{padding:9px 16px;border-radius:12px;font:800 13px var(--sans);color:var(--soft)}.seg button.on{background:#fff;color:var(--kohl);box-shadow:var(--sh)}.seg.dark{background:var(--kohl2)}.seg.dark button{color:var(--onk)}.seg.dark button.on{background:var(--acc);color:var(--kohl);box-shadow:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 18px var(--serif);flex:none;font-style:normal}.av.xl{width:72px;height:72px;font-size:32px}
.empty{padding:24px;text-align:center;color:var(--soft)}
.lbl{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.lnk{font:800 13px var(--sans);color:var(--soft);text-decoration:underline}
/* board */
.bwrap{display:grid;grid-template-columns:1fr 228px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.col{display:grid;gap:12px;align-content:start}
.ch{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:20px;font-size:16px}.ch b{flex:1;font-weight:800}
.ch .dot{width:10px;height:10px;border-radius:50%}.ch .cnt{background:#fff;padding:2px 10px;border-radius:12px;font:800 13px var(--sans)}
.c-wip{background:var(--acclt)}.c-wip .dot{background:var(--acc)}.c-kept{background:var(--oklt)}.c-kept .dot{background:var(--ok)}.c-delivered{background:var(--chalk)}.c-delivered .dot{background:var(--soft)}
.tk{position:relative;background:#fff;border-radius:20px;box-shadow:var(--sh);cursor:pointer}
.band{display:block;height:8px;border-radius:20px 20px 0 0}.s-wip .band{background:var(--acc)}.s-kept .band{background:var(--ok)}.s-delivered .band{background:var(--chalk)}
.tb{padding:16px 16px 14px;display:grid;gap:8px}.tr{display:flex;justify-content:space-between;align-items:center}
.tok{font:800 11px var(--sans);letter-spacing:.1em;color:var(--soft)}
.due{padding:4px 10px;border-radius:10px;background:var(--acclt);font:800 13px var(--sans)}.due.late{background:var(--badlt);color:var(--bad)}.due.now{background:var(--acc)}.due.dn{background:var(--chalk2);color:var(--soft)}
.tt{font:400 22px/1.15 var(--serif)}.tc{color:var(--soft);font-size:15px}
.swr{display:flex;gap:6px}.swr i{width:30px;height:10px;border-radius:5px}
.tf{position:relative;border-top:2px dashed var(--chalk);padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.tf::before,.tf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--cotton)}.tf::before{left:-10px}.tf::after{right:-10px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.star{color:var(--acc);font-size:20px}
.tk.sel{box-shadow:0 0 0 3.5px var(--kohl)}

async function billSheet(ids){const b=billData(ids),ph=(b.c.phone||'').replace(/\D/g,'').slice(-10),url='https://wa.me/'+(ph?'91'+ph:'')+'?text='+encodeURIComponent(billText(b));

 const cv=await drawBill(b);const e=$('#bimg');if(e){e.className='';e.innerHTML=`<img class="bimg" src="${cv.toDataURL('image/png')}">`}}
async function shareImg(s){const b=billData(s.split(',')),cv=await drawBill(b);cv.toBlob(async bl=>{const f=new File([bl],'bill-'+b.no+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:b.c.name})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=f.name;a.click()}})}
/* ---------- PIN lock ---------- */
const hp=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sb'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(p)}};
let pinBuf='',hid=0;
function lock(){if(!localStorage.getItem('sb_pin'))return;pinBuf='';$('#lock').hidden=false;drawPin()}
function drawPin(){$('#lock').innerHTML=`<div class="lkc"><div class="logo xl">S</div><h1>Stitch Book</h1><p>${t('enter_pin')}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'disabled style="visibility:hidden"':''} onclick="pk('${k}')">${k}</button>`).join('')}</div><button class="lnk" onclick="forgot()">${t('forgot')}</button></div>`}
async function pk(k){if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;drawPin();if(pinBuf.length===4){if(await hp(pinBuf)===localStorage.getItem('sb_pin')){$('#lock').hidden=true;pinBuf=''}else{pinBuf='';toast(t('wrong'));drawPin()}}}
async function forgot(){const c=prompt(t('rc'));if(!c)return;if(await hp(c.trim())===localStorage.getItem('sb_rc')){localStorage.removeItem('sb_pin');$('#lock').hidden=true;render()}else toast(t('wrong'))}
async function setPin(){const p=prompt(t('newpin'));if(!/^\d{4}$/.test(p||''))return;localStorage.setItem('sb_pin',await hp(p));const rc=String(Math.floor(1e5+Math.random()*9e5));localStorage.setItem('sb_rc',await hp(rc));alert(t('rc_note')+' '+rc);render()}
function rmPin(){if(confirm(t('confirm'))){localStorage.removeItem('sb_pin');render()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>6e4)lock()});
