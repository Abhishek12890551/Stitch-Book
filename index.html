:root{
 --ink:#263c33;--chalk:#f6f2ea;--red:#b86b4b;--brass:#c39b61;--green:#527b68;

 color-scheme:light;
}
html,body{min-height:100%;background:var(--chalk);color:var(--ink)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,.serif{font-family:"DM Serif Display","Iowan Old Style",Georgia,serif;font-weight:400;letter-spacing:-.025em}

.app{grid-template-columns:252px minmax(0,1fr);min-height:100vh}
nav{
 position:sticky;top:0;height:100vh;padding:30px 18px 22px;gap:7px;
 background:#263c33;border:0;border-right:1px solid rgba(255,255,255,.08);
 box-shadow:8px 0 30px rgba(38,60,51,.06)

V.money=()=>{const m=today().slice(0,7),sp=D.e.filter(e=>e.d.startsWith(m)).reduce((s,e)=>s+e.amt,0),inc=D.o.flatMap(o=>o.pay).filter(p=>p.d.startsWith(m)).reduce((s,p)=>s+p.amt,0),pending=D.o.filter(o=>o.status!=='delivered').reduce((s,o)=>s+Math.max(0,bal(o)),0);return '<div class="top"><div><h1>Khata & reports</h1><div class="sub">A clear picture of what came in and what went out.</div></div><button class="btn" onclick="expForm()">+ Add expense</button></div><div class="grid g3"><div class="stat" style="background:var(--terracotta);color:white"><span style="color:#f8d7ce">To collect</span><b class="num">'+money(pending)+'</b></div><div class="stat" style="background:var(--peacock-lt)"><span>Received this month</span><b class="num">'+money(inc)+'</b></div><div class="stat" style="background:var(--terracotta-lt)"><span>Spent this month</span><b class="num">'+money(sp)+'</b></div></div><div class="grid g2" style="margin-top:16px"><div class="rail-card pad" style="margin:0"><h2 style="margin:0 0 6px">Six-month performance</h2><div class="sub">'+t('report')+'</div>'+report()+'</div><div class="rail-card pad" style="margin:0"><h2 style="margin:0 0 12px">Today\'s closing</h2>'+tclose()+'<button class="btn alt" style="margin-top:12px" onclick="exportCsv()">Export records</button></div></div><h2 style="margin-top:24px">Expenses</h2>'+([...D.e].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>'<div class="row"><div><b>'+t(e.cat)+'</b><div class="sub">'+dfmt(e.d)+' · '+esc(e.note||'')+'</div></div><div class="r"><b>'+money(e.amt)+'</b><div><button class="btn alt sm" onclick="delExp(\''+e.id+'\')">Delete</button></div></div></div>').join('')||'<div class="empty">No expenses recorded yet.</div>')};
const THEMES=[['cotton','Cotton & Terracotta','#fbf8f2','#d4543a','#1d1b1a'],['sand','Sand & Olive','#f8f5ec','#78845a','#343a2d'],['midnight','Midnight & Amber','#171b24','#e3aa54','#f4eee2'],['berry','Berry & Blush','#fbf4f4','#a94e70','#503342']];
V.settings=()=>{const lb=D.lastBackup?new Date(D.lastBackup).toLocaleString():t('never'),active=localStorage.getItem('sb_theme')||'cotton';return '<div class="top"><div><h1>Settings</h1><div class="sub">Make Stitch Book feel like your own workshop.</div></div></div><div class="settings-layout" style="display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px"><div><section class="rail-card pad" style="margin:0"><h2 style="margin:0 0 12px">Your workspace</h2><label>'+t('shopname')+'</label><input id="sn" value="'+esc((D.shop||{}).name||'')+'" onchange="setShop()"><label>'+t('phone')+'</label><input id="sp" type="tel" value="'+esc((D.shop||{}).phone||'')+'" onchange="setShop()"><h3 style="margin-top:22px">Language</h3><div class="chips"><button class="'+(L==='en'?'on':'')+'" onclick="setL(\'en\')">English</button><button class="'+(L==='hi'?'on':'')+'" onclick="setL(\'hi\')">हिन्दी</button></div><h3>Text size</h3><div class="chips"><button class="'+(!bigOn()?'on':'')+'" onclick="setBig(0)">Normal</button><button class="'+(bigOn()?'on':'')+'" onclick="setBig(1)">Large</button></div></section><section class="rail-card pad" style="margin:14px 0 0"><h2 style="margin:0 0 12px">Appearance</h2><div class="theme-grid">'+THEMES.map(([id,name,bg,accent,ink])=>'<button class="theme-choice '+(active===id?'active':'')+'" onclick="setTheme(\''+id+'\')"><span class="theme-preview" style="background:'+bg+'"><i style="background:'+accent+'"></i><b style="background:'+ink+'"></b><em style="background:'+accent+'"></em></span><strong>'+name+'</strong><small>'+(active===id?'Selected':'Tap to apply')+'</small></button>').join('')+'</div></section></div><div><section class="rail-card pad" style="margin:0"><h2 style="margin:0 0 12px">Backup & restore</h2><div class="sub">Last backup: <b>'+lb+'</b></div><p class="sub">'+t('bk_help')+'</p><div class="grid g2"><button class="btn" onclick="backup()">Back up now</button><button class="btn alt" onclick="$(\'#rf\').click()">Restore file</button></div><input id="rf" type="file" accept=".json,application/json" hidden onchange="restoreFile(this.files[0])"><p class="sub" id="pst"></p></section><section class="rail-card pad" style="margin:14px 0 0"><h2 style="margin:0 0 12px">Security</h2><div class="sub">'+(localStorage.getItem('sb_pin')?t('pin_on'):t('pin_off'))+'</div><div class="grid g2" style="margin-top:12px"><button class="btn" onclick="setPin()">'+(localStorage.getItem('sb_pin')?t('change'):t('set'))+'</button>'+(localStorage.getItem('sb_pin')?'<button class="btn alt" onclick="rmPin()">'+t('remove')+'</button>':'<span></span>')+'</div></section><section class="rail-card pad" style="margin:14px 0 0"><h2 style="margin:0 0 12px">Data & exports</h2><button class="btn alt" onclick="exportCsv()">Export orders, payments & expenses</button><h3>Recently deleted</h3>'+(D.bin||[]).map((b,i)=>'<div class="row"><div><b>'+esc(binName(b))+'</b><div class="sub">'+dfmt(dstr(new Date(b.t)))+'</div></div><button class="btn alt sm" onclick="unbin('+i+')">Restore</button></div>').join('')+'<h3>Garment types</h3>'+(D.types||[]).map((x,i)=>'<div class="row"><b>'+esc(x)+'</b><button class="btn alt sm" onclick="delType('+i+')">Delete</button></div>').join('')+'</section><section class="rail-card pad" style="margin:14px 0 0"><h2 style="margin:0 0 12px">Automatic safety copies</h2><div id="snaps"></div></section></div></div>'};
applyTheme();render();
</script></body></html>
