<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<title>Stitch Book</title>
<style>
:root{--ink:#1F2A44;--chalk:#EDF0F3;--red:#B5304A;--brass:#B8862B;--green:#2F7D6B;--mute:#667089;--line:#D8DDE6;--tape:#F2D675;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--chalk);color:var(--ink);font:17px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
h1,h2,h3,.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;margin:0}
h1{font-size:32px}h2{font-size:22px;margin:22px 0 10px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--ink);position:sticky;top:0;height:100vh;padding:26px 14px;display:flex;flex-direction:column;gap:6px}
nav .brand{color:#fff;font-size:26px;padding:0 10px 22px}
nav button{background:none;border:0;color:#BFC8DC;font:600 18px inherit;text-align:left;padding:15px 14px;border-radius:12px;min-height:52px}
nav button.on{background:var(--tape);color:var(--ink)}
.tape{height:26px;background:var(--tape);background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10px),repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 100px);background-size:100% 9px,100% 18px;background-repeat:repeat-x;background-position:bottom,bottom}
main{min-width:0}.pad{padding:24px;max-width:1000px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.btn{min-height:50px;padding:0 22px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 17px inherit}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.btn.sm{min-height:42px;padding:0 14px;font-size:15px}
input,select,textarea{width:100%;min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:17px inherit}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .num{font-size:28px;display:block;margin-top:4px}.stat span{font-size:14px;color:var(--mute)}
.stat.big{grid-column:span 2;background:var(--ink);border:0;border-radius:20px;padding:22px}.stat.big span{color:#BFC8DC}.stat.big .num{font-size:44px;color:var(--tape)}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.row .r{text-align:right}.sub{font-size:14px;color:var(--mute)}.late{color:var(--red);font-weight:600}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600;background:#E3E7EE}
.pill.cutting{background:#F6E4B5}.pill.stitching{background:#D6E0F5}.pill.ready{background:#CFE8DF;color:#1d5e4e}.pill.delivered{background:#fff;border:1px solid var(--line);color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 14px;padding-bottom:4px}
.chips button{flex:none;min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font:600 15px inherit;color:var(--ink)}.chips button.on{background:var(--ink);color:#fff}
.warn{background:#FBE9EC;border:1px solid #E7B4BE;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.m{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m label{margin:6px 0 2px}
.empty{text-align:center;color:var(--mute);padding:30px}
dialog{border:0;border-radius:20px;padding:22px;width:min(580px,94vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:rgba(20,28,46,.5)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}#toast.on{opacity:1}
@media(max-width:760px){.app{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}nav .brand{display:none}nav button{flex:1;text-align:center;padding:10px 2px;font-size:14px;min-height:48px}main{padding-bottom:84px}.g4{grid-template-columns:1fr 1fr}.m{grid-template-columns:1fr 1fr}.pad{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.row{border-left:5px solid var(--line)}.row.s-new{border-left-color:#9AA5BD}.row.s-cutting{border-left-color:var(--brass)}.row.s-stitching{border-left-color:#4C6FBF}.row.s-ready{border-left-color:var(--green)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 19px Georgia,serif;color:#fff;flex:none}
.stat.big{position:relative}.stat.big::after{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(242,214,117,.55);border-radius:14px;pointer-events:none}
h1::after{content:"";display:block;width:64px;border-top:3px dashed var(--red);margin-top:6px}
nav button svg{width:22px;height:22px;vertical-align:-5px;margin-right:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gp{display:flex;flex-wrap:wrap;gap:8px;max-height:210px;overflow-y:auto;padding:2px}.gp button{min-height:44px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:#fff;font:600 15px inherit;color:var(--ink)}.gp button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.gp button.cu{border-style:dashed}
@media(max-width:760px){nav button svg{display:block;margin:0 auto 2px}nav button{font-size:12px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main><div class="tape"></div><div class="pad" id="main"></div></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const T={en:{},hi:{}};
`home|Home|होम
orders|Orders|ऑर्डर

search|Search name or phone|नाम या फ़ोन खोजें

new|New|नया

need|Please fill name, garment and price.|नाम, कपड़ा और कीमत भरें।
customer|Customer|ग्राहक
or_new|Or type a new customer name|या नए ग्राहक का नाम लिखें
protected|Storage is protected from automatic clearing|स्टोरेज अपने-आप साफ़ होने से सुरक्षित है
notprot|Add to Home Screen so records stay safe|रिकॉर्ड सुरक्षित रखने के लिए Home Screen पर जोड़ें
fab|Fabric|कपड़ा
thr|Thread and buttons|धागा और बटन
wag|Helper wages|मज़दूरी
rent|Rent|किराया
elec|Electricity|बिजली
oth|Other|अन्य
bust|Bust|छाती
waist|Waist|कमर
hip|Hip|कूल्हा
shoulder|Shoulder|कंधा
sleeve|Sleeve|बाज़ू
length|Length|लंबाई
neck|Neck|गला
armhole|Armhole|आर्महोल
taken|Taken on|नाप की तारीख
orders_of|Orders|ऑर्डर
nodel|Delete this customer's orders first.|पहले इस ग्राहक के ऑर्डर हटाएं।
payments|Payments|भुगतान
date|Date|तारीख
custom|Or add your own garment|या अपना कपड़ा जोड़ें
add|Add|जोड़ें
mytypes|My garment types|मेरे जोड़े हुए कपड़े
mytypes_help|Garments you add while making an order appear here.|ऑर्डर बनाते समय जो कपड़े आप जोड़ेंगे वे यहाँ दिखेंगे।`.split('\n').forEach(l=>{const[a,b,c]=l.split('|');T.en[a]=b;T.hi[a]=c});
let L=localStorage.getItem('sb_lang')||'en';const t=k=>T[L][k]||T.en[k]||k;
let D={c:[],o:[],e:[],types:[],lastBackup:0};
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('stitchbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbGet(k){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}}
async function idbSet(k,v){try{const db=await idb();return await new Promise(ok=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>ok(true);tx.onerror=()=>ok(false)})}catch(e){return false}}
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const dfmt=i=>i?new Date(i+'T00:00').toLocaleDateString(L==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const money=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cust=id=>D.c.find(c=>c.id===id),ord=id=>D.o.find(o=>o.id===id);
const paid=o=>o.pay.reduce((s,p)=>s+p.amt,0),bal=o=>o.price-paid(o);
const ST=['new','cutting','stitching','ready','delivered'],M=['bust','waist','hip','shoulder','sleeve','length','neck','armhole'],CAT=['fab','thr','wag','rent','elec','oth'];
const GT=[['Blouse','ब्लाउज़'],['Salwar suit','सलवार सूट'],['Kurti','कुर्ती'],['Lehenga','लहंगा'],['Petticoat','पेटीकोट'],['Saree fall and pico','साड़ी फॉल-पीको'],['Alteration','अल्टरेशन'],['Anarkali','अनारकली'],['Churidar','चूड़ीदार'],['Palazzo','पलाज़ो'],['Patiala salwar','पटियाला सलवार'],['Punjabi suit','पंजाबी सूट'],['Sharara','शरारा'],['Choli','चोली'],['Dupatta','दुपट्टा'],['Gown','गाउन'],['Maxi dress','मैक्सी ड्रेस'],['Nighty','नाइटी'],['Skirt','स्कर्ट'],['Top','टॉप'],['Pant or trouser','पैंट/ट्राउज़र'],['Jacket or shrug','जैकेट/श्रग'],['Designer blouse','डिज़ाइनर ब्लाउज़'],['Bridal blouse','दुल्हन ब्लाउज़'],['School uniform','स्कूल यूनिफ़ॉर्म'],['Lining','अस्तर']];
const gname=x=>{if(L!=='hi')return x;const g=GT.find(y=>y[0]===x);return g?g[1]:x};
const types=()=>[...GT.map(g=>g[0]),...(D.types||[]).filter(x=>!GT.some(g=>g[0]===x))];
let selItem='';
function drawGp(){const e=$('#gp');if(!e)return;e.innerHTML=types().map(x=>{const cu=(D.types||[]).includes(x);return `<button class="${x===selItem?'on':''} ${cu?'cu':''}" data-x="${esc(x)}">${esc(gname(x))}</button>`}).join('')}
function addType(){const v=$('#ci').value.trim();if(!v)return;D.types=D.types||[];let m=types().find(x=>x.toLowerCase()===v.toLowerCase());if(!m){D.types.push(v);m=v}selItem=m;$('#ci').value='';drawGp();save()}
async function delType(i){if(!confirm(t('confirm')))return;D.types.splice(i,1);await commit()}
$('#dlg').addEventListener('click',e=>{const b=e.target.closest('#gp button');if(b){selItem=b.dataset.x;drawGp()}});
const AVC=['#B5304A','#2F7D6B','#4C6FBF','#B8862B','#7A4E9C','#1F2A44'];
const av=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return `<div class="av" style="background:${AVC[h%6]}">${esc([...n.trim()][0]||'?').toUpperCase()}</div>`};
const ICON={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',orders:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/></svg>',customers:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>',money:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8h6M9 11.5h6M10 8c4 0 4 5 0 5l4 4"/></svg>',settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>'};
async function save(){const s=JSON.stringify(D);try{localStorage.setItem('sb_mirror',s)}catch(e){}await idbSet('db',s);
 const sn=(await idbGet('snap'))||[],day=today(),i=sn.findIndex(x=>x.day===day);if(i>=0)sn[i]={day,data:s};else sn.push({day,data:s});while(sn.length>10)sn.shift();await idbSet('snap',sn)}
const commit=async()=>{await save();render()};
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const sheet=h=>{$('#dlg').innerHTML=h;if(!$('#dlg').open)$('#dlg').showModal()},shut=()=>$('#dlg').close();
let tab='home',q='',flt='all';
const TABS=['home','orders','customers','money','settings'];
function go(x){tab=x;q='';flt='all';render()}
function render(){document.documentElement.lang=L;
 $('#nav').innerHTML='<div class="brand serif">Stitch Book</div>'+TABS.map(x=>`<button class="${x===tab?'on':''}" onclick="go('${x}')">${ICON[x]}${t(x)}</button>`).join('');
 $('#main').innerHTML=V[tab]()}
const V={};
V.home=()=>{const m=today().slice(0,7),open=D.o.filter(o=>o.status!=='delivered');
 const pend=D.o.reduce((s,o)=>s+Math.max(0,bal(o)),0),inc=D.o.flatMap(o=>o.pay).filter(p=>p.d.startsWith(m)).reduce((s,p)=>s+p.amt,0),sp=D.e.filter(e=>e.d.startsWith(m)).reduce((s,e)=>s+e.amt,0);
 const soon=open.filter(o=>o.due&&o.due<=addDays(7)).sort((a,b)=>a.due.localeCompare(b.due));
 return `${bkWarn()}<div class="top"><h1>${t('home')}</h1><button class="btn" onclick="orderForm()">+ ${t('add_order')}</button></div>
 <div class="grid g4"><div class="stat big"><span>${t('pending')}</span><b class="num serif">${money(pend)}</b></div>
 <div class="stat"><span>${t('income')}</span><b class="num serif" style="color:var(--green)">${money(inc)}</b></div>
 <div class="stat"><span>${t('spent')}</span><b class="num serif" style="color:var(--red)">${money(sp)}</b></div></div>
 <h2>${t('dueweek')}</h2>${soon.map(oRow).join('')||`<div class="empty">${t('nothing')}</div>`}`};
const bkWarn=()=>(D.o.length||D.c.length)&&Date.now()-D.lastBackup>7*864e5?`<div class="warn"><span>${t('bk_warn')}</span><button class="btn red sm" onclick="backup()">${t('backup_now')}</button></div>`:'';
const oRow=o=>{const c=cust(o.cid),b=bal(o),late=o.status!=='delivered'&&o.due&&o.due<today();
 return `<div class="row s-${o.status}" onclick="openOrder('${o.id}')"><div><b>${esc(gname(o.item))}</b><div class="sub">${esc(c?.name)}</div></div><div class="r"><span class="pill ${o.status}">${t(o.status)}</span><div class="sub ${late?'late':''}">${dfmt(o.due)}${late?' ('+t('overdue')+')':''}</div><div class="sub">${b>0?t('balance')+' '+money(b):'✓'}</div></div></div>`};
const sBox=()=>`<input placeholder="${t('search')}" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=LIST[tab]()">`;
const LIST={};
LIST.orders=()=>{const k=q.toLowerCase(),l=D.o.filter(o=>(flt==='all'||o.status===flt)&&(!k||(o.item+(cust(o.cid)?.name||'')+(o.fabric||'')).toLowerCase().includes(k))).sort((a,b)=>(a.status==='delivered')-(b.status==='delivered')||(a.due||'9').localeCompare(b.due||'9'));return l.map(oRow).join('')||`<div class="empty">${t('nothing')}</div>`};
V.orders=()=>`<div class="top"><h1>${t('orders')}</h1><button class="btn" onclick="orderForm()">+ ${t('add_order')}</button></div>${sBox()}
 <div class="chips">${['all',...ST].map(s=>`<button class="${flt===s?'on':''}" onclick="flt='${s}';render()">${t(s)}</button>`).join('')}</div><div id="list">${LIST.orders()}</div>`;
const cBal=id=>D.o.filter(o=>o.cid===id).reduce((s,o)=>s+Math.max(0,bal(o)),0);
LIST.customers=()=>{const k=q.toLowerCase(),l=D.c.filter(c=>!k||(c.name+c.phone).toLowerCase().includes(k)).sort((a,b)=>a.name.localeCompare(b.name));
 return l.map(c=>`<div class="row" onclick="custSheet('${c.id}')"><div style="display:flex;gap:12px;align-items:center">${av(c.name)}<div><b>${esc(c.name)}</b><div class="sub">${esc(c.phone)}</div></div></div><div class="r">${cBal(c.id)>0?`<b style="color:var(--red)">${money(cBal(c.id))}</b>`:''}</div></div>`).join('')||`<div class="empty">${t('nothing')}</div>`};
V.customers=()=>`<div class="top"><h1>${t('customers')}</h1><button class="btn" onclick="custForm()">+ ${t('add_cust')}</button></div>${sBox()}<div id="list" style="margin-top:14px">${LIST.customers()}</div>`;
V.money=()=>{const m=today().slice(0,7),sp=D.e.filter(e=>e.d.startsWith(m)).reduce((s,e)=>s+e.amt,0),inc=D.o.flatMap(o=>o.pay).filter(p=>p.d.startsWith(m)).reduce((s,p)=>s+p.amt,0);
 return `<div class="top"><h1>${t('money')}</h1><button class="btn" onclick="expForm()">+ ${t('add_exp')}</button></div>
 <div class="grid g2"><div class="stat"><span>${t('income')}</span><b class="num serif" style="color:var(--green)">${money(inc)}</b></div><div class="stat"><span>${t('spent')}</span><b class="num serif" style="color:var(--red)">${money(sp)}</b></div></div>
 <h2 style="margin-top:22px">${t('spent')}</h2>
 ${[...D.e].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<div class="row"><div><b>${t(e.cat)}</b><div class="sub">${dfmt(e.d)} ${esc(e.note)}</div></div><div class="r"><b>${money(e.amt)}</b><div><button class="btn alt sm" onclick="delExp('${e.id}')">${t('delete')}</button></div></div></div>`).join('')||`<div class="empty">${t('nothing')}</div>`}`};
V.settings=()=>{const lb=D.lastBackup?new Date(D.lastBackup).toLocaleString():t('never');
 return `<h1>${t('settings')}</h1><h2>${t('lang')}</h2><div class="chips"><button class="${L==='en'?'on':''}" onclick="setL('en')">English</button><button class="${L==='hi'?'on':''}" onclick="setL('hi')">हिन्दी</button></div>
 <h2>Backup</h2><div class="stat"><div class="sub">${t('last_bk')}: <b>${lb}</b></div><p class="sub">${t('bk_help')}</p><div class="grid g2"><button class="btn" onclick="backup()">${t('backup_now')}</button><button class="btn alt" onclick="$('#rf').click()">${t('restore')}</button></div><input id="rf" type="file" accept=".json,application/json" hidden onchange="restoreFile(this.files[0])"><p class="sub" id="pst"></p></div>
 <h2>${t('mytypes')}</h2>${(D.types||[]).map((x,i)=>`<div class="row"><b>${esc(x)}</b><button class="btn alt sm" onclick="delType(${i})">${t('delete')}</button></div>`).join('')||`<div class="sub">${t('mytypes_help')}</div>`}<h2>${t('autocopies')}</h2><div id="snaps"></div>`};
async function afterSettings(){if(tab!=='settings')return;const sn=(await idbGet('snap'))||[];const e=$('#snaps');if(e)e.innerHTML=[...sn].reverse().map(s=>{let n='';try{const d=JSON.parse(s.data);n=d.o.length+' '+t('orders')+', '+d.c.length+' '+t('customers')}catch(x){}return `<div class="row"><div><b>${esc(s.day.startsWith('pre')?'Before restore':dfmt(s.day))}</b><div class="sub">${n}</div></div><button class="btn alt sm" onclick="restoreSnap('${s.day}')">${t('use')}</button></div>`}).join('');
 const p=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false;const pe=$('#pst');if(pe)pe.textContent=p?'✓ '+t('protected'):t('notprot')}
const _r=render;render=function(){_r();afterSettings()};
function setL(x){L=x;localStorage.setItem('sb_lang',x);render()}
const F=(id,lab,v='',type='text',extra='')=>`<label>${lab}</label><input id="${id}" type="${type}" value="${esc(v)}" ${extra}>`;
const val=id=>$('#'+id).value.trim();
function custForm(){sheet(`<h2>${t('add_cust')}</h2>${F('cn',t('name'))}${F('cp',t('phone'),'','tel')}<div class="grid g2" style="margin-top:18px"><button class="btn alt" onclick="shut()">${t('close')}</button><button class="btn" onclick="saveCust()">${t('save')}</button></div>`)}
async function saveCust(){if(!val('cn'))return toast(t('need'));D.c.push({id:uid(),name:val('cn'),phone:val('cp'),meas:[]});shut();await commit()}
function orderForm(cid=''){selItem='';setTimeout(drawGp,0);sheet(`<h2>${t('add_order')}</h2><label>${t('customer')}</label><select id="oc"><option value=""></option>${[...D.c].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 ${F('on',t('or_new'))}<label>${t('item')}</label><div class="gp" id="gp"></div><div style="display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px"><input id="ci" placeholder="${t('custom')}"><button class="btn alt" onclick="addType()">+ ${t('add')}</button></div>
 ${F('of',t('fabric'))}<div class="grid g2"><div>${F('od',t('due'),addDays(7),'date')}</div><div>${F('op',t('price'),'','number','inputmode="numeric"')}</div></div>${F('oa',t('advance'),'','number','inputmode="numeric"')}
 <div class="grid g2" style="margin-top:18px"><button class="btn alt" onclick="shut()">${t('close')}</button><button class="btn" onclick="saveOrder()">${t('save')}</button></div>`)}
async function saveOrder(){let cid=$('#oc').value;const nn=val('on'),item=selItem,price=+val('op');
 if(!item||!price||(!cid&&!nn))return toast(t('need'));
 if(!cid){cid=uid();D.c.push({id:cid,name:nn,phone:'',meas:[]})}
 const a=+val('oa')||0;D.o.push({id:uid(),cid,item,fabric:val('of'),due:val('od'),price,status:'new',created:today(),pay:a>0?[{d:today(),amt:a}]:[]});shut();await commit()}
function openOrder(id){const o=ord(id),c=cust(o.cid),b=bal(o),ph=(c.phone||'').replace(/\D/g,'');
 const msg=encodeURIComponent(`Namaste ${c.name}, your ${o.item} balance is ${money(b)}. Thank you.`);
 sheet(`<h2>${esc(gname(o.item))}</h2><div class="sub">${esc(c.name)} ${esc(o.fabric)}</div>
 <div class="chips" style="margin-top:14px">${ST.map(s=>`<button class="${o.status===s?'on':''}" onclick="setSt('${id}','${s}')">${t(s)}</button>`).join('')}</div>
 <div class="grid g2"><div class="stat"><span>${t('paid')}</span><b class="num serif" style="color:var(--green)">${money(paid(o))}</b></div><div class="stat"><span>${t('balance')}</span><b class="num serif" style="color:${b>0?'var(--red)':'var(--ink)'}">${money(b)}</b></div></div>
 <div class="grid g2"><div>${F('xd',t('due'),o.due,'date',`onchange="upd('${id}','due',this.value)"`)}</div><div>${F('xp',t('price'),o.price,'number',`inputmode="numeric" onchange="upd('${id}','price',+this.value)"`)}</div></div>
 <label>${t('payments')}</label>${o.pay.map(p=>`<div class="sub">${dfmt(p.d)}: <b>${money(p.amt)}</b></div>`).join('')}
 <div class="grid g2" style="margin-top:10px;align-items:end"><div>${F('pa',t('amount'),'','number','inputmode="numeric"')}</div><button class="btn" onclick="addPay('${id}')">${t('add_pay')}</button></div>
 <div class="grid g2" style="margin-top:18px">${b>0&&ph?`<a class="btn alt" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/91${ph.slice(-10)}?text=${msg}">${t('remind')}</a>`:'<span></span>'}<button class="btn alt" onclick="shut()">${t('close')}</button></div>
 <p><button class="btn red sm" onclick="delOrd('${id}')">${t('delete')}</button></p>`)}
async function setSt(id,s){ord(id).status=s;await save();render();openOrder(id)}
async function upd(id,k,v){ord(id)[k]=v;await save();render();openOrder(id)}
async function addPay(id){const a=+val('pa');if(!a)return;ord(id).pay.push({d:today(),amt:a});await save();render();openOrder(id)}
async function delOrd(id){if(!confirm(t('confirm')))return;D.o=D.o.filter(o=>o.id!==id);shut();await commit()}
function custSheet(id){const c=cust(id),m=c.meas[c.meas.length-1],os=D.o.filter(o=>o.cid===id);
 sheet(`<h2>${esc(c.name)}</h2>${c.phone?`<a href="tel:${esc(c.phone)}" style="color:var(--ink)">${esc(c.phone)}</a>`:''}
 <h3 style="margin-top:18px">${t('meas')}</h3><div class="sub">${m?t('taken')+' '+dfmt(m.d):''}</div><div class="m">${M.map(k=>`<div><label>${t(k)}</label><input id="m_${k}" type="number" inputmode="decimal" step="0.25" value="${m?esc(m.v[k]||''):''}"></div>`).join('')}</div>
 <p><button class="btn sm" onclick="saveMeas('${id}')">${t('add_meas')}</button></p>
 <h3>${t('orders_of')}</h3>${os.map(o=>`<div class="row s-${o.status}" onclick="openOrder('${o.id}')"><div><b>${esc(gname(o.item))}</b><div class="sub">${dfmt(o.due)}</div></div><span class="pill ${o.status}">${t(o.status)}</span></div>`).join('')||`<div class="sub">${t('nothing')}</div>`}
 <div class="grid g2" style="margin-top:14px"><button class="btn" onclick="shut();orderForm('${id}')">+ ${t('add_order')}</button><button class="btn alt" onclick="shut()">${t('close')}</button></div>
 <p><button class="btn red sm" onclick="delCust('${id}')">${t('delete')}</button></p>`)}
async function saveMeas(id){const c=cust(id),v={};M.forEach(k=>{if($('#m_'+k).value)v[k]=$('#m_'+k).value});const e={d:today(),v},i=c.meas.findIndex(x=>x.d===e.d);if(i>=0)c.meas[i]=e;else c.meas.push(e);await save();toast('✓');custSheet(id)}
async function delCust(id){if(D.o.some(o=>o.cid===id))return toast(t('nodel'));if(!confirm(t('confirm')))return;D.c=D.c.filter(c=>c.id!==id);shut();await commit()}
function expForm(){sheet(`<h2>${t('add_exp')}</h2><label>${t('category')}</label><select id="ec">${CAT.map(c=>`<option value="${c}">${t(c)}</option>`).join('')}</select>${F('ea',t('amount'),'','number','inputmode="numeric"')}${F('ed',t('date'),today(),'date')}${F('en',t('notes'))}
 <div class="grid g2" style="margin-top:18px"><button class="btn alt" onclick="shut()">${t('close')}</button><button class="btn" onclick="saveExp()">${t('save')}</button></div>`)}
async function saveExp(){const a=+val('ea');if(!a)return toast(t('need'));D.e.push({id:uid(),d:val('ed')||today(),cat:$('#ec').value,amt:a,note:val('en')});shut();await commit()}
async function delExp(id){if(!confirm(t('confirm')))return;D.e=D.e.filter(e=>e.id!==id);await commit()}
async function backup(){const name='stitchbook-backup-'+today()+'.json',blob=new Blob([JSON.stringify({app:'stitchbook',v:1,at:new Date().toISOString(),data:D})],{type:'application/json'}),f=new File([blob],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name})}catch(e){if(e.name==='AbortError')return}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
 D.lastBackup=Date.now();await save();render();toast(t('bk_done'))}
async function keepCurrent(){const sn=(await idbGet('snap'))||[];sn.push({day:'pre'+Date.now(),data:JSON.stringify(D)});while(sn.length>12)sn.shift();await idbSet('snap',sn)}
async function restoreFile(f){if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='stitchbook'||!Array.isArray(j.data.c))throw 0;if(!confirm(t('confirm')))return;await keepCurrent();D=Object.assign({c:[],o:[],e:[],lastBackup:0},j.data);await commit();toast(t('restored'))}catch(e){toast(t('bad_file'))}}
async function restoreSnap(day){const sn=(await idbGet('snap'))||[],s=sn.find(x=>x.day===day);if(!s||!confirm(t('confirm')))return;await keepCurrent();D=Object.assign({c:[],o:[],e:[],lastBackup:0},JSON.parse(s.data));await commit();toast(t('restored'))}
(async()=>{let s=await idbGet('db');if(!s)s=localStorage.getItem('sb_mirror');if(s){try{D=Object.assign(D,JSON.parse(s))}catch(e){}}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render()})();
</script></body></html>
